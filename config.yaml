# Orchestrator settings. Secrets do NOT go here: they live in .env.
# Paths are relative to this file's folder unless absolute.

paths:
  streamers: streamers.yaml
  database: data/orchestrator.db
  logs: logs
  # ffmpeg.exe, or the folder that holds it. Empty: use the ffmpeg on PATH.
  ffmpeg: ""
  # Chat replays and audio downloaded while scanning (audio is deleted after measuring).
  cache: data/cache
  # The cut windows sent to Clips Kitty.
  windows: data/windows
  # Live recordings (1-minute pieces, deleted after live.retention_hours) and their chat.
  recordings: data/live

clipskitty:
  # Clips Kitty's local API. Must stay on 127.0.0.1 / localhost: it has no
  # authentication, and Clips Kitty refuses any other Host header.
  url: http://127.0.0.1:8765
  # The Clips Kitty version this orchestrator was tested against. A different
  # version is allowed but logged as a warning.
  tested_version: "2.1.0"
  # The GTA plugin that finds the moments in every job (installed in Clips Kitty).
  gta_plugin_id: colingpt9/gta-vi-highlights
  gta_plugin_version: "0.4.1"
  # The GTA plugin only spots physical events (chases, crashes) in the transcript, so it finds
  # nothing in a window that is funny because of what the streamer says. When it finds nothing,
  # send the window once more to Clips Kitty's own moment finder (its AI setting: local Ollama
  # here, so free), which follows the focus text below. false: keep the plugin's answer.
  fallback_to_clipskitty_finder: true
  # Our own local plugin (plugins/exact-moments, installed in Clips Kitty): we name the clip's exact
  # range and Clips Kitty only lays it out, captions and renders it. Clips Kitty's finders kept making
  # 12-25 s clips that cut the story short. Each window's range is the moment we found plus padding:
  # a Twitch clip's viewer-clipped range, or before/after a live chat spike's peak (chat reacts late,
  # so most of it is before). Ends move up to snap_seconds to a sentence break.
  exact_moments:
    enabled: true
    id: gta6clips/exact-moments
    version: "1.1.0"
    # Tight on purpose (2026-11-22): on Roasted Clipz ~60% swiped away in the first seconds, so a
    # clip starts at the setup and ends just after the reaction, 20-40 s.
    pad_seconds: 2             # around a Twitch clip's viewer-clipped range
    live_before_peak: 30       # live: seconds before the chat spike's peak (chat is ~20 s late)...
    live_after_peak: 8         # ...and after it
    snap_seconds: 4
  # Options sent with every job.
  job:
    gaming: true           # Gaming / Reaction layout: webcam + game
    captions: true
    max_clips: 8           # per video in Phase 1 (a whole VOD); live windows will use 1-2
    focus: >-
      Funny or wild GTA 6 moments built around the streamer: his out-of-pocket
      one-liners and roasts, trolling or fighting NPCs, NPC road rage, run-ins
      with cops, his reactions to the radio, TV, gore or a bug, dumb plans going
      wrong, crashes, chaotic physics, insane stunts. Prefer a joke with its
      punchline and his reaction over plain action. Skip story cutscenes and
      game-character dialogue. Start right at the setup, with no dead air, and
      end just after the payoff and his reaction: 20-40 seconds in all.
  # How often to ask Clips Kitty whether a job is finished, and for how long.
  poll_seconds: 30
  job_timeout_hours: 6

clips:
  # Our target length. Clips outside it are kept but flagged for review.
  # Shorts that hold viewers best are 20-40 s: setup, payoff, reaction, no dead air.
  min_seconds: 15
  max_seconds: 45

# The check every new clip gets before it reaches the review page. A clip that fails goes to the
# "Needs a fix" tab instead (with why). A clip that's too short or cut off at the edge of its
# recording is first sent back once with a wider range, when the recording has room.
qa:
  enabled: true
  min_seconds: 15            # shorter than this: too short to show the whole story
  edge_seconds: 1.5          # this close to the start or end of the recording: cut off
  widen_seconds: 8           # how much wider each side, when sending it back
  require_split: true        # no webcam in the picture (layout "fill"): needs a fix

metadata:
  # Every clip carries these, plus a hashtag of the streamer's name.
  hashtags: ["#GTA6", "#GTAVI", "#Shorts"]
  # Added to Clips Kitty's title as the first title option (the plain one stays as the second).
  # The big streamer-clip channels name the streamer in every title ("... | xQc GTA VI"),
  # because viewers search for the streamer. "" turns it off.
  title_suffix: " | {streamer} GTA 6"

# Phase 2: which moments of a stream are worth sending (python -m gta6clips scan <url>).
# Each signal is compared with the same stream's own recent baseline, so big and
# small channels are judged on their own normal.
scoring:
  bin_seconds: 5            # the stream is scored in slices this long
  smooth_bins: 3            # averaged over this many slices, so one odd slice isn't a spike
  baseline_seconds: 600     # "normal" is the previous 10 minutes
  min_baseline_seconds: 120 # nothing counts as a spike in the first 2 minutes
  z_cap: 12                 # one signal can't dominate beyond this; 6 flattened the top spikes into ties
  threshold: 4.5            # combined score a moment needs to be sent (12 spikes on 7.7 h Rob Run, 57 on 19.4 h GTA 6)
  weights:                  # re-balanced automatically when a signal is missing (no chat replay, say)
    chat: 0.45              # messages per slice
    keywords: 0.35          # messages with one of the words below
    audio: 0.2              # loudness (yelling, crashes)
  # Hype words in chat. Whole words, any case. "re:" starts a regular expression.
  # Regular expressions go in single quotes so YAML leaves the backslashes alone.
  chat_keywords: ["clip it", "clip that", "clipped", "kekw", "lul", "lmao", "lmfao", "omegalul",
                  "no way", "wtf", "bruh", "holy", "insane", "💀", "😂", "🤣", "😭", ":face-with-tears-of-joy:",
                  "out of pocket", "cancelled", "diabolical", "crashout", "crash out", "kek",
                  're:\?{3,}', 're:\b(?:ha){3,}\b', 're:\bl+o+l+\b']

windows:
  lead_in_seconds: 120   # chat reacts after the moment, so start well before the spike
  tail_seconds: 60
  max_seconds: 240       # nearby spikes merge into one window up to this length
  max_per_stream: 6      # the best N windows of a VOD (Clips Kitty runs one job at a time)
  max_clips: 2           # clips Clips Kitty may make from one window
  # When Clips Kitty finds moments but every render fails (usually "CUDA error": the GPU ran out of
  # memory), the window is sent again under a new file name (so it's transcribed afresh too), after
  # a pause that lets its AI model leave the GPU. After this many tries it stops and tells you.
  render_retries: 2
  render_retry_minutes: 5
  # yt-dlp format for the cut windows: up to 1080p, video + audio merged to mp4.
  # H.264 (avc1) first: Clips Kitty converts AV1 to H.264 before working, which is slow.
  video_format: "bv*[height<=1080][vcodec^=avc1]+ba[ext=m4a]/bv*[height<=1080][ext=mp4]+ba[ext=m4a]/bv*[height<=1080]+ba/b[height<=1080]/b"

# Phase 3: watch permitted streamers and clip their GTA 6 streams while they're live
# (python -m gta6clips watch). YouTube only for now. Uses windows: and scoring: above too.
live:
  poll_seconds: 150            # how often each channel's /live page is checked (yt-dlp, no API quota)
  tick_seconds: 15             # how often recordings are read and scored
  max_concurrent_streams: 3    # streams recorded at once, highest priority first
  stop_after_misses: 2         # checks in a row offline / not GTA 6 before a recording stops
  retention_hours: 2           # recorded 1-minute pieces older than this are deleted (~4 GB/h at 1080p)
  segment_seconds: 60
  # What ffmpeg records: up to 1080p H.264 + audio (YouTube live serves them separately).
  video_format: "bv*[height<=1080][vcodec^=avc1]+ba/b[height<=1080][vcodec^=avc1]/bv*[height<=1080]+ba/b"
  # Live chat on his streams runs hot all the time, so a laugh burst scores lower than on a
  # replayed VOD: on the first real live stream (2026-11-19) the hour's three big laugh moments
  # scored 4.1-4.4. Replayed minute by minute, these bars sent about 30 windows on the 19 h GTA 6
  # VOD (11 of its top 12) and 4 on the 7.7 h Rob Run VOD.
  selection:
    threshold: 4.0             # combined score (scoring.threshold is the VOD bar)
    quiet_threshold: 3.5       # the bar once quiet_minutes pass with nothing sent, so a
    quiet_minutes: 45          # quieter stream still gets its best moments
    min_signals: 2             # chat speed, hype words and loudness: at least this many must agree...
    min_signal_z: 2.0          # ...each at least this far over normal
    min_gap_seconds: 480       # a weaker spike within this of a stronger one is dropped
    max_windows_per_hour: 3    # then only a moment stronger than that hour's best gets through
    min_baseline_seconds: 300  # learn the stream's normal for 5 minutes before sending anything

# Phase 4: the review page (python -m gta6clips review). Only ever on 127.0.0.1.
review:
  port: 8770                 # not 8765, which is Clips Kitty's

# Phase 5: uploads to YouTube through Clips Kitty, from the review page's Approved tab
# (or python -m gta6clips publish). Every upload is scheduled: it goes up private and YouTube
# publishes it at the slot's time. Nothing is ever uploaded public, and only approved clips go.
# Twitch's most-viewed GTA 6 clips of permitted Twitch streamers (streamers.yaml, platform: twitch).
# Viewers clip the best moments; `watch` checks every every_minutes, cuts each clip from the VOD with
# some lead-in and tail, and Clips Kitty's own moment finder makes the Short around the clipped
# range. Needs TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET in .env. `twitch-clips --dry-run` previews.
twitch_clips:
  enabled: true
  game_name: Grand Theft Auto VI   # looked up on Twitch at runtime and cached
  every_minutes: 120
  hours: 24                  # clips made in the last this many hours
  min_views: 50
  min_score: 60              # review score 1-99 (100 views = 40, 1,000 = 60, ~1,800 = 65, 10,000 = 80)
  max_per_streamer: 3        # per check
  max_per_run: 6             # per check, all streamers together (most viewed first)
  lead_in_seconds: 45        # cut from the VOD this long before the clip...
  tail_seconds: 30           # ...and after it (setup, reaction, and slack for hand trimming)
  focus: >-
    Funny or wild GTA 6 moment. Keep the setup, the payoff and the streamer's reaction,
    with no dead air before or after: 20-40 seconds. Skip story cutscenes.

publish:
  timezone: America/Chicago
  # Daily slots, local time. Gaming Shorts do best mid-afternoon (after school and work) and in the
  # evening, weekends strongest. Starting points: move them to what YouTube Studio's "When your
  # viewers are on YouTube" shows once the channel has views. One clip per slot.
  slots:
    weekdays: ["15:00", "20:00"]
    weekends: ["12:00", "15:00", "20:00"]
  # Approving a clip on the review page uploads it right away into the next free slot (private
  # until then). false: approved clips wait for the Approved tab's "Plan the uploads" button.
  auto_schedule: true
  min_lead_minutes: 20         # a slot sooner than this is skipped (YouTube needs at least 15)
  category_id: "20"            # Gaming
  made_for_kids: false
  notify_subscribers: true
  contains_synthetic_media: false
  quota_warn_at: 80            # warn when this many of the day's uploads are used (YouTube allows 100)
  # YouTube permanently locks uploads from a Google Cloud project that hasn't passed its API audit
  # to private: scheduled clips would then never go public. After the first such upload, scheduling
  # stops. Set true only if you're fine with private-only uploads (making them public by hand fails too).
  accept_locked_private: false
  # YouTube channels besides the one connected in Clips Kitty, uploaded to directly (a streamer picks
  # one with youtube_channel in streamers.yaml). Each gets its own slots. Needs the Google Cloud OAuth
  # client JSON (Desktop app) at secrets/youtube_client.json, then `connect-youtube <key>` once;
  # handle is checked at sign-in so uploads can't land on the wrong channel.
  channels:
    cutscene_skipped:
      title: Cutscene Skipped
      handle: "@CutsceneSkipped"

# Phone notifications through a Discord webhook. Put the webhook link in .env as
# DISCORD_WEBHOOK_URL (Discord: channel settings → Integrations → Webhooks → New Webhook →
# Copy Webhook URL). Nothing is sent while it's unset.
notify:
  discord: true
  new_clips: true            # a clip is ready for review (or held as a spoiler)
  live: true                 # a stream started or stopped recording
  published: true            # an upload went through (with its YouTube link and time)
  problems: true             # warnings and errors, e.g. recording or a render failing
  problem_repeat_minutes: 30 # the same problem at most this often

# Clips that may show major story missions or the ending are held (status spoiler_hold)
# and kept out of the main review queue. Free keyword check, no API key needed.
spoilers:
  # Checked in the stream title, the clip's title and its transcript; one hit holds the clip.
  keywords: ["spoiler", "spoilers", "ending", "final mission", "last mission", "end credits",
             "credits roll", "epilogue", "finale", "plot twist", "story mission", "main mission",
             "cutscene"]
  # Checked in chat around the clip; it takes chat_min_hits messages to hold it.
  chat_keywords: ["spoiler", "spoilers", "ending", "final mission", "last mission", "credits", "finale",
                  "plot twist", "cutscene"]
  chat_min_hits: 3

gta6:
  # Words that mark a video or stream as GTA 6 (YouTube doesn't expose the game).
  keywords: ["gta 6", "gta vi", "gta6", "gtavi", "grand theft auto vi", "grand theft auto 6"]

llm:
  # false: clips keep Clips Kitty's own title (free, no API key needed).
  # true: Claude writes 3 title options and an on-screen hook per clip
  #       (about 2-4 cents a clip; needs ANTHROPIC_API_KEY in .env).
  enabled: false
  model: claude-opus-5-5
  effort: medium
